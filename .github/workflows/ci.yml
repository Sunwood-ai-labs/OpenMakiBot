name: CI fixture comparison (Node 24.21.0)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: upstream-baseline
            ref: 03a6e88bc13ad2c2fb5c16a80d1a0b732b88d588
          - source: sync-candidate
            ref: f42b9bcd36a3ab5f60edf72ad08c2c90c7599dcd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/node-compare"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"

      - name: Capture runtime and package versions
        env:
          SOURCE_NAME: ${{ matrix.source }}
          SOURCE_REF: ${{ matrix.ref }}
        run: |
          set -eu
          output_dir="$RUNNER_TEMP/node-compare"
          {
            printf 'source=%s\n' "$SOURCE_NAME"
            printf 'ref=%s\n' "$SOURCE_REF"
            printf 'checked_out_sha='; git rev-parse HEAD
            printf 'vite_config_blob='; git rev-parse HEAD:vite.config.ts
            printf 'cwd='; pwd
            printf 'node='; node --version
            printf 'pnpm='; pnpm --version
            printf 'vitest='; pnpm exec vitest --version
            printf 'electron='; node -p "require('electron/package.json').version"
            printf 'runner='; uname -a
          } | tee "$output_dir/environment.txt"
          cat /etc/os-release > "$output_dir/os-release.txt"
          pnpm list --depth=0 --json > "$output_dir/package-versions.json"

      - name: Run representative Linux fixtures
        env:
          OMB_VITEST_E2E: 'all'
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/node-compare/vitest-retries.jsonl
        run: |
          set -o pipefail
          pnpm exec vitest run \
            server/cloud-team-engine-homes.e2e.test.ts \
            server/cloud-team-owners.e2e.test.ts \
            server/engine-homes/box.linux.test.ts \
            --reporter=default \
            --reporter=github-actions \
            --reporter=json \
            --outputFile.json="$RUNNER_TEMP/node-compare/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/node-compare/fixture-logs.txt"

      - name: Summarize CI retries
        if: always()
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/node-compare/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs | tee -a "$RUNNER_TEMP/node-compare/fixture-logs.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-compare-${{ matrix.source }}-24.21.0
          path: ${{ runner.temp }}/node-compare
          if-no-files-found: warn
          retention-days: 7
